services:
  # Private Redis for centralized sessions and disposable cache data. Render
  # private services have no public URL; connect from the API over the private
  # network at axis-redis:6379 (see infra/redis/README.md). Keep every service
  # in the same Render region. REDIS_PASSWORD is generated by Render and is
  # never stored in this repository.
  - type: pserv
    name: axis-redis
    runtime: docker
    dockerfilePath: ./infra/redis/Dockerfile
    dockerContext: ./infra/redis
    plan: 0.5c-512mb
    disk:
      name: axis-redis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        generateValue: true
      - key: REDISCLI_AUTH
        fromService:
          name: axis-redis
          type: pserv
          envVarKey: REDIS_PASSWORD
      - key: REDIS_KEY_PREFIX
        value: axis
      - key: REDIS_MAXMEMORY
        value: 256mb
      - key: REDIS_MAXMEMORY_POLICY
        value: volatile-lru
      - key: REDIS_APPENDONLY
        value: "yes"

  # Private Orthanc instance for the deployed API. Render's private network is
  # the only inbound path, so Orthanc does not need public HTTP auth. The API
  # still sends ORTHANC_USERNAME/ORTHANC_PASSWORD when those are configured.
  - type: pserv
    name: axis-orthanc
    runtime: docker
    dockerfilePath: ./infra/orthanc/Dockerfile.prod
    dockerContext: ./infra/orthanc
    plan: 1c-2g
    disk:
      name: axis-orthanc-data
      mountPath: /var/lib/orthanc/db
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8042"
      - key: ORTHANC_AUTH_ENABLED
        value: "false"
