services:

  postgres:
    image: postgres:16-alpine
    container_name: axis-postgres
    environment:
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: axis_dev
      POSTGRES_DB: axis_pacs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axis -d axis_pacs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Centralized session/cache store. Built from infra/redis so local and Render
  # run the same configuration. The host port is bound to loopback only; the
  # container port is otherwise reachable solely on the private compose network.
  redis:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    image: axis-redis:7.4
    container_name: axis-redis
    environment:
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-axis}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
      REDIS_APPENDONLY: ${REDIS_APPENDONLY:-yes}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: axis-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: axis
      RABBITMQ_DEFAULT_PASS: axis_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  orthanc:
    image: jodogne/orthanc-plugins:1.12.6
    container_name: axis-orthanc
    expose:
      - "8042"
    volumes:
      - ./infra/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u orthanc:orthanc -H 'Accept: application/dicom+json' http://localhost:8042/dicom-web/studies || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: axis-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  minio:
    image: minio/minio:latest
    container_name: axis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ohif:
    # Built from infra/ohif/Dockerfile, which rebases the viewer onto /ohif/.
    # The upstream ohif/app image bakes its asset URLs in as root-relative, so
    # /ohif/ would otherwise load the HTML but 404 on every script, style and
    # lazily loaded chunk and render a blank viewer.
    build:
      context: ./infra/ohif
      dockerfile: Dockerfile
    image: axis-ohif:v3.13.0-ohif-prefix
    container_name: axis-ohif
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - orthanc
    ports:
      - "3001:80"
    volumes:
      - ./infra/ohif/app-config.js:/usr/share/nginx/html/ohif/app-config.js:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  orthanc_data:
  keycloak_data:
  minio_data: