services:
  postgres:
    image: postgres:16-alpine
    container_name: axis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${AXIS_PACS_DB:-axis_pacs}
      POSTGRES_TEST_DB: ${AXIS_PACS_TEST_DB:-axis_pacs_test}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - axis_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  orthanc:
    image: jodogne/orthanc-plugins:1.12.6
    container_name: axis-orthanc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"
      - "4242:4242"
    volumes:
      - ./infra/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    networks:
      - axis_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ohif:
    # Keep the path-prefix-aware build and existing app configuration intact.
    build:
      context: ./infra/ohif
      dockerfile: Dockerfile
    image: axis-ohif:v3.13.0-ohif-prefix
    container_name: axis-ohif
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      orthanc:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./infra/ohif/app-config.js:/usr/share/nginx/html/ohif/app-config.js:ro
    networks:
      - axis_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ohif/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  axis_internal:
    driver: bridge

volumes:
  postgres_data:
  orthanc_data:
