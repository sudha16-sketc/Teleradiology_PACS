# AXIS Redis runtime template. Rendered by docker-entrypoint.sh with envsubst.
# Only the variables listed in that script are expanded. No secret is in this
# file: ${REDIS_PASSWORD} is injected from the runtime environment.
port ${REDIS_PORT}
bind 0.0.0.0
protected-mode yes

# Private Render service / container network only. Do not publish this port to
# the public internet; local Compose binds it to 127.0.0.1 only.
dir ${REDIS_DATA_DIR}
requirepass "${REDIS_PASSWORD}"

# Sessions and cache entries always carry a TTL. volatile-* keeps eviction
# limited to expiring keys; size the plan so sessions are not the first to go.
maxmemory ${REDIS_MAXMEMORY}
maxmemory-policy ${REDIS_MAXMEMORY_POLICY}
appendonly ${REDIS_APPENDONLY}
appendfsync everysec
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000

# Connection and idle limits.
timeout ${REDIS_CLIENT_IDLE_TIMEOUT}
tcp-keepalive ${REDIS_TCP_KEEPALIVE}
maxclients ${REDIS_MAXCLIENTS}

# Administrative commands that could erase session state are unavailable.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command DEBUG ""

loglevel warning
logfile ""
